name: "CI"

# The official reusable workflow (glpi-project/plugin-ci-workflows) expects the plugin at
# the repository root; here it lives in plugins/documentaliste/. This workflow reproduces
# its checks with the same official images, plus:
#   - Tesseract installed, and PHPUnit failing on skipped tests (OCR tests must really run);
#   - an end-to-end test on the RUNTIME (production) GLPI image, which lacks GLPI dev deps.

on:
  push:
    branches:
      - "master"
  pull_request:
  workflow_dispatch:

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  PLUGIN_KEY: "documentaliste"

jobs:
  qa:
    name: "QA — GLPI ${{ matrix.glpi }} / PHP ${{ matrix.php }}"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { glpi: "11.0.x", php: "8.2" }
          - { glpi: "12.0.x", php: "8.3" }
    container:
      image: "ghcr.io/glpi-project/githubactions-glpi-apache:php-${{ matrix.php }}-glpi-${{ matrix.glpi }}"
      options: "--user github-actions-runner"
    services:
      db:
        image: "ghcr.io/glpi-project/githubactions-mariadb:10.11"
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: "glpi"
        options: "--shm-size=1g"
    defaults:
      run:
        # Same as the official workflow: run as `www-data` to avoid rights issues on GLPI files.
        shell: "sudo --set-home --user=www-data --preserve-env bash --noprofile --norc -eo pipefail {0}"
        working-directory: "/var/www/glpi/plugins/documentaliste"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: "Install Tesseract OCR"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          sudo apt-get update -q
          sudo apt-get install --assume-yes --no-install-recommends --quiet \
            tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng
          tesseract --version | head -1

      - name: "Deploy plugin into GLPI"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          sudo cp -a "plugins/${PLUGIN_KEY}" "/var/www/glpi/plugins/${PLUGIN_KEY}"
          sudo chown -R www-data:www-data "/var/www/glpi/plugins/${PLUGIN_KEY}"

      - name: "Composer install"
        run: |
          composer install --ansi --no-interaction --no-progress --prefer-dist

      - name: "PHP Parallel Lint"
        run: |
          ../../vendor/bin/parallel-lint --show-deprecated --colors --exclude ./vendor/ --no-progress .

      - name: "PHP CS Fixer"
        run: |
          PHP_CS_FIXER_IGNORE_ENV=1 ../../vendor/bin/php-cs-fixer check --config=.php-cs-fixer.php --show-progress=none --diff

      - name: "Rector"
        run: |
          ../../vendor/bin/rector process --dry-run --ansi

      - name: "Licence headers"
        working-directory: "/var/www/glpi"
        run: |
          php bin/console tools:licence_headers_check --ansi --no-interaction --plugin="${PLUGIN_KEY}"

      - name: "PHPStan"
        run: |
          ../../vendor/bin/phpstan analyze --ansi --memory-limit=2G --no-interaction --no-progress

      - name: "Install GLPI test database and plugin"
        working-directory: "/var/www/glpi"
        run: |
          for i in $(seq 1 30); do
            php -r 'exit(@mysqli_connect("db", "root", "", "glpi") ? 0 : 1);' && break
            echo "Waiting for database..." && sleep 2
          done
          bin/console database:install --ansi --no-interaction --db-name=glpi --db-host=db --db-user=root --db-password="" --strict-configuration
          bin/console plugin:install --ansi --no-interaction --username=glpi "${PLUGIN_KEY}"
          bin/console plugin:activate --ansi --no-interaction "${PLUGIN_KEY}"

      - name: "PHPUnit"
        run: |
          # --fail-on-skipped: OCR tests are skipped without Tesseract, they must run here.
          ../../vendor/bin/phpunit --colors=always --fail-on-skipped

  e2e:
    name: "E2E — runtime image GLPI ${{ matrix.glpi }}"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        glpi: ["11", "12"]
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: "Build images, start GLPI and run the OCR end-to-end test"
        run: |
          make e2e GLPI=${{ matrix.glpi }} COMPOSE_BIN="docker compose"

      - name: "GLPI logs"
        if: ${{ failure() }}
        run: |
          docker compose -p documentaliste-glpi${{ matrix.glpi }} logs glpi | tail -n 100
          docker compose -p documentaliste-glpi${{ matrix.glpi }} exec -T glpi sh -c 'tail -n 50 /var/glpi/logs/php-errors.log /var/glpi/logs/cron.log' || true
